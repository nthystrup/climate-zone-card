<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Climate Zone Card preview</title>
<style>
  body { margin: 0; padding: 16px; font-family: Roboto, system-ui, sans-serif; background: #f4f5f7;
    --primary-text-color:#1c1c1c; --secondary-text-color:#646a73; --divider-color:rgba(0,0,0,.12);
    --ha-card-background:#fff; --ha-card-border-radius:12px; --primary-color:#03a9f4; }
  body.dark { background: #111318; --primary-text-color:#e3e5e8; --secondary-text-color:#9aa0a8;
    --divider-color:rgba(255,255,255,.14); --ha-card-background:#1c1f26; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(400px, 100%), 400px)); gap: 16px; align-items: start; }
  h4 { margin: 0 0 6px; font: 600 12px system-ui; color: #888; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
  const params = new URLSearchParams(location.search);
  const dark = params.has("dark");
  if (dark) document.body.classList.add("dark");
  await import("../dist/climate-zone-card.js");

  const e = (id, state, attributes = {}) => ({ entity_id: id, state, attributes });
  const today = new Date();
  const at = (h) => { const d = new Date(today); d.setHours(h, 0, 0, 0); if (d < today) d.setDate(d.getDate() + 1); return d.toISOString(); };
  const thermo = (id, state, over = {}) => e(id, state, {
    hvac_modes: ["off", "heat", "cool", "heat_cool"], min_temp: 45, max_temp: 92, current_temperature: 73,
    temperature: 82, target_temp_high: null, target_temp_low: null, current_humidity: 43, hvac_action: "idle",
    friendly_name: id, ...over });
  const zone = (z, o = {}) => [
    thermo(`climate.${z}_thermostat`, o.mode ?? "cool", o.t ?? {}),
    e(`input_select.${z}_period`, o.period ?? "Home", { options: o.options ?? ["Home", "Sleep"] }),
    e(`input_number.${z}_home_cool`, "76", { min: 65, max: 92, step: 1 }),
    e(`input_number.${z}_home_heat`, "68", { min: 45, max: 79, step: 1 }),
    e(`input_number.${z}_sleep_cool`, "74", { min: 65, max: 92, step: 1 }),
    e(`input_number.${z}_sleep_heat`, "64", { min: 45, max: 79, step: 1 }),
    e(`input_number.${z}_evening_cool`, "75", { min: 65, max: 92, step: 1 }),
    e(`input_number.${z}_evening_heat`, "66", { min: 45, max: 79, step: 1 }),
    e(`input_boolean.${z}_override`, o.override ? "on" : "off"),
    ...(o.guest === false ? [] : [e(`input_boolean.${z}_occupied`, o.occupied ? "on" : "off")]),
    e(`switch.schedule_${z}`, "on", {
      weekdays: ["daily"],
      timeslots: o.timeslots ?? ["07:00 - 20:00", "20:00 - 07:00"],
      entities: [`input_select.${z}_period`],
      actions: (o.slotPeriods ?? ["Home", "Sleep"]).map((p) => ({ service: "input_select.select_option", data: { option: p } })),
      current_slot: 0, next_slot: 1, next_trigger: at(20),
    }),
  ];
  const common = (vac) => [
    e("input_boolean.vacation_mode", vac ? "on" : "off"),
    e("input_number.vacation_cool_setpoint", "82"),
    e("input_number.vacation_heat_setpoint", "60"),
  ];

  const scenarios = [
    ["No guests (live today)", "east_bedroom", [...zone("east_bedroom"), ...common()]],
    ["Guests, Home period", "east_bedroom", [...zone("east_bedroom", { occupied: true, t: { temperature: 76, current_temperature: 77, hvac_action: "cooling" } }), ...common()]],
    ["Manual hold", "east_bedroom", [...zone("east_bedroom", { occupied: true, override: true, t: { temperature: 78 } }), ...common()]],
    ["Vacation", "east_bedroom", [...zone("east_bedroom", { occupied: true }), ...common(true)]],
    ["Heat/Cool, 3 periods", "east_bedroom", [...zone("east_bedroom", { occupied: true, mode: "heat_cool", options: ["Home", "Sleep", "Evening"],
      timeslots: ["07:00 - 17:00", "17:00 - 21:00", "21:00 - 07:00"], slotPeriods: ["Home", "Evening", "Sleep"],
      t: { temperature: null, target_temp_low: 68, target_temp_high: 76, hvac_action: "heating", current_temperature: 66 } }), ...common()]],
    ["Off", "east_bedroom", [...zone("east_bedroom", { occupied: true, mode: "off", t: { temperature: null } }), ...common()]],
    ["Missing helpers", "west_bedroom", [...zone("east_bedroom"), ...common(), thermo("climate.west_bedroom_thermostat", "cool")]],
    ["Linked, out of sync", "great_room", [...zone("great_room", { guest: false }).filter((x) => !x.entity_id.startsWith("climate.")), ...common(),
      thermo("climate.living_room", "cool", { temperature: 80, current_temperature: 74, friendly_name: "Living Room" }),
      thermo("climate.kitchen", "cool", { temperature: 79, current_temperature: 76, hvac_action: "cooling", friendly_name: "Kitchen" })],
      { climate: ["climate.living_room", "climate.kitchen"], name: "Great Room" }],
  ];

  const grid = document.getElementById("grid");
  window.calls = [];
  window.wsCalls = 0;
  // Synthetic recorder history: ~10 min cooling cycles, more of them on hotter days.
  const fakeHistory = (msg) => {
    window.wsCalls++; (window.wsLog ||= []).push(msg.entity_ids.join(",") + " from " + msg.start_time);
    const start = Date.parse(msg.start_time) / 1000, end = Date.parse(msg.end_time) / 1000;
    const out = {};
    for (const id of msg.entity_ids) {
      const rows = [{ s: "cool", a: { hvac_action: "idle" }, lu: start }];
      let seed = id.length;
      for (let t = start; t < end; t += 2700) {
        const h = new Date(t * 1000).getHours();
        seed = (seed * 9301 + 49297) % 233280;
        const hot = (new Date(t * 1000).getDate() % 3) * 0.2 + 0.3;
        if (h >= 9 && h <= 19 && seed / 233280 < hot && t + 600 < end) {
          rows.push({ s: "cool", a: { hvac_action: "cooling" }, lu: t });
          rows.push({ s: "cool", a: { hvac_action: "fan" }, lu: t + 600 });
          rows.push({ s: "cool", a: { hvac_action: "idle" }, lu: t + 601 });
        }
      }
      out[id] = rows;
    }
    return out;
  };
  const layout = params.get("layout") ?? "full";
  for (const [label, z, ents, extra] of scenarios) {
    const wrap = document.createElement("div");
    wrap.innerHTML = `<h4>${label}</h4>`;
    const card = document.createElement("climate-zone-card");
    card.setConfig({ type: "custom:climate-zone-card", zone: z, layout, ...(extra ?? {}) });
    const hass = {
      states: Object.fromEntries(ents.map((x) => [x.entity_id, x])),
      locale: { language: "en", time_format: "12", time_zone: "server" },
      config: { time_zone: Intl.DateTimeFormat().resolvedOptions().timeZone },
      themes: { darkMode: dark },
      callWS: async (msg) => (params.has("nohistory") ? Promise.reject(new Error("history not recorded")) : fakeHistory(msg)),
      callService: async (d, s, data) => {
        window.calls.push([d, s, data]);
        console.log("callService", d, s, JSON.stringify(data));
        const st = { ...hass.states };
        if (d === "input_boolean") {
          const id = data.entity_id; const cur = st[id];
          st[id] = { ...cur, state: s === "toggle" ? (cur.state === "on" ? "off" : "on") : s === "turn_on" ? "on" : "off" };
        }
        if (d === "climate" && s === "set_temperature") for (const id of [].concat(data.entity_id)) {
          const { entity_id, ...rest } = data; st[id] = { ...st[id], attributes: { ...st[id].attributes, ...rest } };
        }
        if (d === "input_number") st[data.entity_id] = { ...st[data.entity_id], state: String(data.value) };
        if (d === "scheduler") {
          if (params.has("failsave")) throw new Error("Simulated failure");
          const read = (data) => ({
            ...(data.weekdays ? { weekdays: data.weekdays } : {}),
            timeslots: data.timeslots.map((t) => `${t.start} - ${t.stop}`),
            actions: data.timeslots.map((t) => ({ service: t.actions[0].service, data: t.actions[0].service_data })),
            entities: [data.timeslots[0].actions[0].entity_id],
          });
          if (s === "edit") st[data.entity_id] = { ...st[data.entity_id], attributes: { ...st[data.entity_id].attributes, ...read(data) } };
          if (s === "add") {
            const id = "switch.schedule_" + data.name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
            st[id] = { entity_id: id, state: "on", attributes: { current_slot: 0, next_slot: 1, next_trigger: at(22), ...read(data) } };
          }
          if (s === "remove") delete st[data.entity_id];
        }
        hass.states = st;
        card.hass = { ...hass };
      },
    };
    card.hass = hass;
    wrap.append(card);
    grid.append(wrap);
  }
</script>
</body>
</html>
